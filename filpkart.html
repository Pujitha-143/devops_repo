<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flipkart Homepage Clone</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <div class="logo">Flipkart</div>
    <input type="text" id="searchBox" placeholder="Search for products, brands and more...">
    <button id="loginBtn">Login</button>
  </header>
 
  <nav>
    <ul>
      <li>Electronics</li>
      <li>TVs & Appliances</li>
      <li>Men</li>
      <li>Women</li>
      <li>Home</li>
      <li>Beauty</li>
      <li>Sports</li>
      <li>More</li>
    </ul>
  </nav>
 
  <main>
    <h2>Top Offers</h2>
    <div class="product-grid" id="productGrid">
      <!-- JS will inject products here -->
    </div>
  </main>
 
  <script src="script.js"></script>
</body>
</html>
